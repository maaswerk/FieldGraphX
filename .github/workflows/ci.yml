name: CI

on:
  push:
    branches: [main, master, "claude/**"]
  pull_request:

jobs:
  build-test-linux:
    name: Build & test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore FieldGraphX.sln

      - name: Build
        run: dotnet build FieldGraphX.sln -c Release --no-restore

      - name: Test
        run: dotnet test tests/FieldGraphX.Core.Tests -c Release --no-build --logger trx

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/*.trx"

  package-windows:
    name: Package plugin (Windows)
    runs-on: windows-latest
    needs: build-test-linux
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build plugin
        run: dotnet build src/FieldGraphX -c Release

      - name: Stage plugin files
        shell: pwsh
        run: |
          $out = "artifacts/Plugins"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $bin = "src/FieldGraphX/bin/Release/net48"
          Copy-Item "$bin/FieldGraphX.dll" $out
          Copy-Item "$bin/FieldGraphX.Core.dll" $out
          Copy-Item "$bin/Microsoft.Web.WebView2.Core.dll" $out
          Copy-Item "$bin/Microsoft.Web.WebView2.WinForms.dll" $out
          Copy-Item "$bin/runtimes/win-x64/native/WebView2Loader.dll" $out

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: FieldGraphX-plugin
          path: artifacts/Plugins
